name: Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    name: Build & Package
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build src/LevelZeroCheck.csproj --configuration Release

      - name: Publish Self-Contained Binary (win-x64)
        run: |
          dotnet publish src/LevelZeroCheck.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o dist/l0check-win-x64
          Compress-Archive -Path dist/l0check-win-x64/* -DestinationPath dist/l0check-win-x64.zip -Force

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: l0check-win-x64
          path: dist/l0check-win-x64.zip

      - name: Release to GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/l0check-win-x64.zip
          generate_release_notes: true
